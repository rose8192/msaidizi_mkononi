name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Adjust to your local version if needed
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd frontend/flutter_app
          flutter pub get

      - name: Build APK
        run: |
          cd frontend/flutter_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: msaidizi-mkononi-apk
          path: frontend/flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Latest Msaidizi Mkononi APK build.
            - Fixed Floating Mic UI
            - Updated Backend Endpoint
            - Improved UI hint text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

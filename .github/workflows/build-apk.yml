name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17 (Required for modern Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Debug Information
        run: |
          echo "Flutter Version:"
          flutter --version
          echo "Java Version:"
          java -version
          echo "Flutter Doctor:"
          flutter doctor

      - name: 5. Get Dependencies
        run: |
          cd frontend/flutter_app
          flutter pub get

      - name: 6. Build Release APK
        run: |
          cd frontend/flutter_app
          # Using --no-tree-shake-icons to avoid common font icon issues in CI
          flutter build apk --release --no-tree-shake-icons

      - name: 7. Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msaidizi-mkononi-apk
          path: frontend/flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: 8. Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

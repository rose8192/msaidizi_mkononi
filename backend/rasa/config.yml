version: "3.1"
language: "en"

# EMERGENCY PLAN D: Ultra-Minimal DIET for MINIMAL MEMORY
# Single layer, minimal dimensions
pipeline:
- name: WhitespaceTokenizer
- name: CountVectorsFeaturizer
- name: DIETClassifier
  epochs: 10
  transformer_layers: 1
  number_of_attention_heads: 1
  use_masked_language_model: false
  embedding_dimension: 10
  hidden_layer_sizes:
    text: [16]
  constrain_similarities: true
- name: EntitySynonymMapper
- name: ResponseSelector
  epochs: 10
  transformer_layers: 1
  number_of_attention_heads: 1
  use_masked_language_model: false
  embedding_dimension: 10
  hidden_layer_sizes:
    text: [16]
  constrain_similarities: true
- name: FallbackClassifier
  threshold: 0.3
  ambiguity_threshold: 0.1

policies:
- name: MemoizationPolicy
  max_history: 3
- name: RulePolicy
assistant_id: 20260208-135131-ash-upstream
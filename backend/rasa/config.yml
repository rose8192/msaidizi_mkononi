version: "3.1"
language: "en"
pipeline:
- name: WhitespaceTokenizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
  analyzer: word
  min_ngram: 1
  max_ngram: 1
- name: DIETClassifier
  epochs: 40
  constrain_similarities: true
- name: EntitySynonymMapper
- name: ResponseSelector
  epochs: 40
  constrain_similarities: true
- name: FallbackClassifier
  threshold: 0.7
  ambiguity_threshold: 0.1
policies:
- name: MemoizationPolicy
  max_history: 3
- name: RulePolicy
- name: TEDPolicy
  max_history: 3
  epochs: 20
  constrain_similarities: true
assistant_id: 20260208-135131-ash-upstream

# Enable debug logging
logging:
  level: DEBUG

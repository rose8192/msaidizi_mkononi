version: "3.1"
stories:
  - story: language selection flow
    steps:
      - intent: greet
      - action: utter_greet
      - intent: choose_language
      - action: action_set_language
      - action: action_service_menu

  - story: service confirmation flow - yes
    steps:
      - action: action_confirm_service
      - intent: affirm
      - action: action_process_service_confirmation

  - story: service confirmation flow - no
    steps:
      - action: action_confirm_service
      - intent: deny
      - action: action_process_service_confirmation

  - story: passport inquiry
    steps:
      - intent: ask_passport_info
      - action: utter_passport_info

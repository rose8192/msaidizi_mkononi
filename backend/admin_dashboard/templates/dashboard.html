<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Msaidizi Mkononi Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .sidebar { height: 100vh; background: #2c3e50; color: white; padding: 20px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <h3>Msaidizi Admin</h3>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Overview</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/api/export/csv">Export CSV</a></li>
                </ul>
            </div>
            <div class="col-md-10 p-4">
                <h2>Analytics Overview</h2>
                <div class="row">
                    <div class="col-md-6">
                        <div class="card p-3">
                            <h5>Frequently Asked Services (Top Intents)</h5>
                            <canvas id="intentsChart"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card p-3">
                            <h5>Language Usage</h5>
                            <canvas id="langChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="card p-3">
                            <h5>Conversation Volume (Last 7 Days)</h5>
                            <canvas id="volumeChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                // Intents Chart
                new Chart(document.getElementById('intentsChart'), {
                    type: 'bar',
                    data: {
                        labels: data.intents.map(i => i.intent),
                        datasets: [{ label: 'Queries', data: data.intents.map(i => i.count), backgroundColor: '#3498db' }]
                    }
                });

                // Language Chart
                new Chart(document.getElementById('langChart'), {
                    type: 'pie',
                    data: {
                        labels: data.languages.map(l => l.language == 'sw' ? 'Kiswahili' : 'English'),
                        datasets: [{ data: data.languages.map(l => l.count), backgroundColor: ['#e74c3c', '#2ecc71'] }]
                    }
                });

                // Volume Chart
                new Chart(document.getElementById('volumeChart'), {
                    type: 'line',
                    data: {
                        labels: data.volume.map(v => v.date).reverse(),
                        datasets: [{ label: 'Conversations', data: data.volume.map(v => v.count).reverse(), borderColor: '#f1c40f', fill: false }]
                    }
                });
            });
    </script>
</body>
</html>

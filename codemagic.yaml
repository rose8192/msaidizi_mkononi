workflows:
  android-release:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - cd frontend/flutter_app
      - flutter clean
      - flutter pub get
      - flutter doctor
      - flutter build apk --release

    artifacts:
      - frontend/flutter_app/build/app/outputs/flutter-apk/app-release.apk
